<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mister O1 Invoices</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header>
    <b>Mister O1 Invoices</b>
    <nav id="nav" class="hidden">
      <a href="#/">Invoice</a>
      <a href="#/profile" id="who"></a>
    </nav>
  </header>
  <div class="test">CLASS PROJECT — test sheet only, emails go to you</div>

  <main>
    <!-- Loading -->
    <section id="sLoading" class="card" style="text-align:center">
      <div class="spinner"></div>
    </section>

    <!-- Sign in -->
    <section id="sLogin" class="card hidden">
      <h2>Sign in</h2>
      <p class="muted">Use the Google account Nico added as a tester.</p>
      <button id="btnGoogle">Sign in with Google</button>
      <div id="loginMsg"></div>
    </section>

    <!-- Upload -->
    <section id="sHome" class="card hidden">
      <h2>New invoice</h2>
      <p class="muted">Take a photo of every page (in order), or choose one PDF.</p>
      <input id="files" type="file" accept="image/*,application/pdf" multiple class="hidden">
      <button id="btnAdd" class="secondary">+ Add pages</button>
      <div id="thumbs" class="thumbs"></div>
      <button id="btnRead" disabled>Read invoice</button>
      <button id="btnClear" class="secondary hidden">Start over</button>
      <div id="uploadMsg"></div>
    </section>

    <!-- Working -->
    <section id="sWorking" class="card hidden" style="text-align:center">
      <div class="spinner"></div>
      <div id="workingText">Reading invoice…</div>
      <p class="muted">This takes about 15–30 seconds.</p>
    </section>

    <!-- AI result (the editable review screen comes in step 3) -->
    <section id="sResult" class="card hidden">
      <h2>What the AI read</h2>
      <div id="resultBox"></div>
      <button id="btnAnother">Read another invoice</button>
    </section>

    <!-- Profile -->
    <section id="sProfile" class="card hidden">
      <h2>Your profile</h2>
      <label>Email</label>
      <input id="pEmail" disabled>
      <label>Name</label>
      <input id="pName" autocomplete="name">
      <label>Initials (goes in the sheet's "Sent By" column)</label>
      <input id="pInitials" maxlength="4" autocapitalize="characters">
      <button id="btnSave">Save</button>
      <button id="btnLogout" class="secondary">Sign out</button>
      <div id="profileMsg"></div>
    </section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
